name: 저장소 활동 알림

# 저장소에서 일어나는 일을 디스코드로 보낸다.
# 배포 알림(release.yml)과 같은 웹훅·같은 모양이고, 다루는 것만 다르다.
on:
  push:
  pull_request:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft]
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]
  release:
    types: [published]
  create:
  delete:
  fork:
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 같은 이벤트가 몰려도 순서대로 하나씩 보낸다.
  group: activity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # 알림만 보내는 일이라 오래 걸릴 이유가 없다.
    timeout-minutes: 5

    steps:
      # 마지막 커밋 제목을 읽을 필요가 없으므로 소스는 받지 않는다.
      # 스크립트만 있으면 되고, 그건 sparse checkout 으로 충분하다.
      - name: 스크립트 받기
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 알림 보내기
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify-activity.mjs
